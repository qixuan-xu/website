<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://mc-panel.qixuan.net/" />
    <title>正在打开 Minecraft 控制台</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #07111f;
        color: #e8f0f8;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(64, 145, 108, 0.18), transparent 36rem),
          radial-gradient(circle at 80% 80%, rgba(79, 140, 255, 0.12), transparent 30rem),
          #07111f;
      }

      main {
        width: min(32rem, calc(100% - 3rem));
        padding: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.045);
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.4rem;
      }

      p {
        margin: 0;
        color: rgba(232, 240, 248, 0.68);
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.7rem 1rem;
        border-radius: 0.65rem;
        background: #2d6a4f;
        color: #fff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>正在打开 Minecraft 控制台</h1>
      <p>控制台受 Cloudflare Access 保护，只允许授权账户登录。</p>
      <a href="https://mc-panel.qixuan.net/">继续进入</a>
    </main>
    <script>
      location.replace("https://mc-panel.qixuan.net/");
    </script>
  </body>
</html>
